  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: #f2e6e9;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    touch-action: pan-y;
  }
  #stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #deck{
    position:relative;
    width:min(92vw, 460px);
    height:min(92vw*1.28, 575px);
  }

  .card{
    position:absolute;
    inset:0;
    border-radius:16px;
    box-shadow: 0 14px 34px rgba(120,50,70,.22);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background-color: var(--paper);
    background-image: var(--page-bg);
    background-size: cover;
    background-position: center;
    transition: transform 850ms cubic-bezier(.22,.68,.18,1), opacity 600ms ease;
    will-change: transform;
  }
  .card.dragging{ transition: none; }
  .card.top{ cursor: grab; }
  .card.top:active{ cursor: grabbing; }

  .cover-face{
    background-image: var(--page-bg);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cover-number{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(64px, 22vw, 120px);
    color: var(--rose-dark);
    opacity:.9;
  }
  .closing-face{
    background-size: cover;
    background-position: center;
  }

  .page-inner{
    flex:1;
    padding: 10% 9%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width: thin;
  }
  .page-inner::-webkit-scrollbar{ width:4px; }
  .page-inner::-webkit-scrollbar-thumb{ background: rgba(194,99,122,.35); border-radius:4px; }
  .page-inner p{
    margin: 0 0 0.85em 0;
    font-size: clamp(14.5px, 3.9vw, 17px);
    line-height:1.5;
  }
  .page-inner ol{
    margin: 0.3em 0 0 0;
    padding-left: 1.15em;
  }
  .page-inner li{
    font-size: clamp(14px, 3.6vw, 16px);
    line-height:1.45;
    margin-bottom:.4em;
  }
  .page-num{
    text-align:center;
    font-family:'Caveat', cursive;
    color: var(--rose);
    font-size:15px;
    padding-bottom: 4%;
  }

  #controls{
    position:fixed;
    left:0; right:0; bottom: 4%;
    display:flex;
    justify-content:center;
    gap:14px;
    z-index:50;
  }
  #controls button{
    font-family:'Cormorant Garamond', serif;
    font-size:14px;
    letter-spacing:.03em;
    border:none;
    background: rgba(255,255,255,.8);
    color: var(--rose-dark);
    padding:9px 18px;
    border-radius:999px;
    box-shadow: 0 4px 14px rgba(120,50,70,.18);
  }
  #controls button:disabled{ opacity:.35; }
  #controls button:active{ transform: scale(.96); }

  #progress{
    position:fixed;
    top: 4%;
    left:0; right:0;
    text-align:center;
    font-family:'Caveat', cursive;
    color: var(--rose-dark);
    font-size:16px;
    z-index:50;
    opacity:.8;
  }

  #hint{
    position:fixed;
    bottom: 11%;
    left:0; right:0;
    text-align:center;

sequence.forEach((item, idx)=>{
  const el = document.createElement('div');
  el.className = 'card';
  const z = sequence.length - idx;
  el.style.zIndex = z;
  el.dataset.zindex = z;
  el.dataset.idx = idx;
  el.innerHTML = cardInner(item);
  deck.appendChild(el);
});

const cards = Array.from(document.querySelectorAll('.card'));
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
let current = 0;
const STACK_DEPTH = 3;

function exitTransform(dir){
  return `translateX(${dir*160}%) translateY(22px) rotate(${dir*16}deg)`;
}
function enterTransform(){
  return `translateX(-145%) translateY(26px) rotate(-14deg)`;
}

function layout(){
  cards.forEach((card, idx)=>{
    card.classList.remove('top');
    if(idx < current){
      card.style.zIndex = 0;
      const dir = Number(card.dataset.dir || 1);
      card.style.transform = exitTransform(dir);
      card.style.pointerEvents = 'none';
    } else {
      const offset = idx - current;
      if(offset > STACK_DEPTH){
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        card.style.transform = `translateY(${STACK_DEPTH*10}px) scale(${1 - STACK_DEPTH*0.04})`;
      } else {
        card.style.opacity = offset === 0 ? '1' : String(1 - offset*0.12);
        card.style.transform = `translateY(${offset*10}px) scale(${1 - offset*0.04})`;
        card.style.pointerEvents = offset === 0 ? 'auto' : 'none';
        if(offset === 0) card.classList.add('top');
      }
    }
  });
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === cards.length;
  nextBtn.textContent = current === 0 ? "open ›" : (current === cards.length ? "the end" : "next ›");
  progress.textContent = current === 0 ? "" : `card ${current} of ${cards.length}`;
  hint.style.display = current === cards.length ? 'none' : 'block';
}

function dismissTop(direction){
  if(current >= cards.length) return;
  const card = cards[current];
  card.dataset.dir = direction;
  card.classList.remove('dragging');
  card.style.zIndex = 0;
  card.style.transform = exitTransform(direction);
  current++;
  layout();
}

function restorePrev(){
  if(current === 0) return;
  const frozenTop = current < cards.length ? cards[current] : null;
  current--;
  const card = cards[current];

  if(frozenTop){
    frozenTop.classList.remove('top', 'dragging');
    frozenTop.style.pointerEvents = 'none';
  }

  card.classList.remove('dragging');
  card.style.transition = 'none';
  card.style.zIndex = 0;
  card.style.transform = enterTransform();
  void card.offsetWidth;
  card.style.zIndex = card.dataset.zindex;
  card.style.transition = '';
  card.style.transform = 'translateY(0px) scale(1)';
  card.style.opacity = '1';
  card.style.pointerEvents = 'auto';
  card.classList.add('top');

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === cards.length;
  nextBtn.textContent = current === 0 ? "open ›" : (current === cards.length ? "the end" : "next ›");
  progress.textContent = current === 0 ? "" : `card ${current} of ${cards.length}`;
  hint.style.display = current === cards.length ? 'none' : 'block';
}

nextBtn.addEventListener('click', ()=> dismissTop(1));
prevBtn.addEventListener('click', restorePrev);

let dragging = false, startX = 0, startY = 0, dx = 0, activeCard = null;

function pointerDown(e){
  if(current >= cards.length) return;
  const card = cards[current];
  if(!card.classList.contains('top')) return;
  dragging = true;
  activeCard = card;
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX; startY = p.clientY; dx = 0;
  card.classList.add('dragging');
}
function pointerMove(e){
  if(!dragging || !activeCard) return;
  const p = e.touches ? e.touches[0] : e;
  dx = p.clientX - startX;
  const dy = p.clientY - startY;
  if(Math.abs(dx) < Math.abs(dy)) return;
  e.preventDefault();
  const rot = dx / 18;
  activeCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
}
function pointerUp(){
  if(!dragging || !activeCard) return;
  dragging = false;
  const threshold = 90;
  if(dx < -threshold){
    dismissTop(-1);
  } else if(dx > threshold){
    activeCard.classList.remove('dragging');
    activeCard.style.transform = '';
    restorePrev();
  } else {
    activeCard.classList.remove('dragging');
    activeCard.style.transform = '';
  }
  activeCard = null;
}

deck.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
deck.addEventListener('touchstart', pointerDown);
deck.addEventListener('touchmove', pointerMove, {passive: false});
deck.addEventListener('touchend', pointerUp);

layout();
